languages = ReSpecT 2.2
containers = alice.respect.core.RespectTCContainer
resolvers = Respect22Resolver

Note:
1) Attenzione alla sintassi: i nomi delle classi devono essere separati da una virgola e l'ultimo deve essere seguito da un punto.
2) Il nome della classe dei containers deve essere il nome completo (cioè anche con il package specificato);
3) I package in cui vanno collocate la classi dei resolver e dei translator sono rispettivamente alice.tucson.resolver e alice.tucson.translator

